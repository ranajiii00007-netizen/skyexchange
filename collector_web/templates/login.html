{% extends "base.html" %}

{% block body %}
<main class="login-shell">
  <section class="login-panel">
    <p class="eyebrow">SKY EXCHANGE</p>
    <h1>Collector Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" class="login-form">
      <label>
        Username
        <input name="username" autocomplete="username" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign In</button>
    </form>
    <div class="pwa-install-container" style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px; text-align: center;">
      <button onclick="triggerPwaInstall()" class="btn btn-secondary pwa-install-btn" style="width: 100%; display: inline-flex; font-size: 13px; gap: 8px; justify-content: center;">
        📥 Download Collector App
      </button>
      <button onclick="shareAppLink('Collector Portal', '/login')" class="btn btn-secondary" style="width: 100%; display: inline-flex; font-size: 13px; gap: 8px; justify-content: center; border-color: var(--success); color: var(--success-dark);">
        🟢 Share App Link / WhatsApp
      </button>
    </div>
  </section>
</main>
{% endblock %}
